# -----------------------------------------------------------------------------
# 6b. OVH PUBLIC CLOUD: crear la instancia desde Tower (equivalente a "Hetzner")
#     Ejecutar desde cualquier servidor (el comando ignora `server`) o como
#     Scheduled Task. Requiere rights GET/POST/DELETE /cloud/* en el token OVH.
# -----------------------------------------------------------------------------
- cetmix_tower_model: server_template
  reference: efactusv_ovh_cloud_debian12
  name: efactusv - OVH Public Cloud Debian 12 (usuario debian)
  ssh_port: 22
  ssh_username: debian
  ssh_auth_mode: k
  use_sudo: n
  note: |
    Para instancias creadas por el comando "OVH Cloud: crear instancia".
    La imagen Debian 12 de OVH ya trae el usuario `debian` con sudo NOPASSWD y la clave SSH inyectada:
    no hace falta bootstrap manual. Sin flight plan: el comando lo lanza cuando SSH responde.
  variable_value_ids:
  - variable_id: base_dir
    value_char: /opt/efactusv
  - variable_id: ovh_endpoint
    value_char: ovh-eu
  - variable_id: ovh_zone_name
    value_char: efactusv.com

- cetmix_tower_model: command
  reference: efactusv_ovh_cloud_create_server
  name: "efactusv - OVH Cloud: crear instancia y registrarla en Tower"
  action: python_code
  access_level: root
  allow_parallel_run: false
  note: |
    Idempotente: si ya existe una instancia con ese nombre en la región, la reutiliza;
    si ya existe el servidor en Tower, solo actualiza la IP.
    Pasos: clave SSH en el proyecto -> flavor/imagen por nombre -> POST instance -> esperar ACTIVE + IPv4
    -> create_server_from_template -> esperar SSH -> guardar host key -> ejecutar plan "Preparar servidor".
  code: |
    client = ovh.Client(
        endpoint={{ ovh_endpoint }},
        application_key=#!cxtower.secret.OVH_APPLICATION_KEY!#,
        application_secret=#!cxtower.secret.OVH_APPLICATION_SECRET!#,
        consumer_key=#!cxtower.secret.OVH_CONSUMER_KEY!#,
    )
    project = {{ ovh_cloud_project }}
    region = {{ ovh_cloud_region }}
    flavor_name = {{ ovh_cloud_flavor }}
    image_name = {{ ovh_cloud_image }}
    server_name = {{ new_server_name }}
    public_key = {{ tower_ssh_public_key }}
    ssh_key_ref = {{ tower_ssh_key_ref }}
    template_ref = {{ ovh_server_template }}
    base = "/cloud/project/" + project
    log = []

    # 1. Clave SSH de Tower registrada en el proyecto
    key_id = None
    for k in client.get(base + "/sshkey"):
        if k.get("publicKey", "").split(" ")[:2] == public_key.split(" ")[:2]:
            key_id = k["id"]
    if not key_id:
        key_id = client.post(base + "/sshkey", name="cetmix-tower", publicKey=public_key)["id"]
        log.append("Clave SSH registrada en OVH")

    # 2. Flavor e imagen por nombre en la región
    flavor_id = None
    for f in client.get(base + "/flavor", region=region):
        if f.get("name") == flavor_name and f.get("osType") == "linux":
            flavor_id = f["id"]
            break
    image_id = None
    for i in client.get(base + "/image", region=region, osType="linux"):
        if i.get("name") == image_name:
            image_id = i["id"]
            break
    if not flavor_id or not image_id:
        result = {"exit_code": 1, "message": "Flavor o imagen no encontrados en " + region + ": " + flavor_name + " / " + image_name}
    else:
        # 3. Instancia (reutiliza si ya existe con ese nombre)
        instance = None
        for i in client.get(base + "/instance", region=region):
            if i.get("name") == server_name:
                instance = i
        if not instance:
            instance = client.post(
                base + "/instance",
                flavorId=flavor_id, imageId=image_id, name=server_name,
                region=region, sshKeyId=key_id, monthlyBilling=False,
            )
            log.append("Instancia creada: " + instance["id"])
        else:
            log.append("Instancia ya existente: " + instance["id"])

        # 4. Esperar ACTIVE + IPv4 pública (máx. 10 min)
        ipv4 = None
        status = None
        for _ in range(60):
            inst = client.get(base + "/instance/" + instance["id"])
            status = inst.get("status")
            if status == "ACTIVE":
                for a in inst.get("ipAddresses", []):
                    if a.get("type") == "public" and a.get("version") == 4:
                        ipv4 = a.get("ip")
                if ipv4:
                    break
            if status == "ERROR":
                break
            time.sleep(10)
        if not ipv4:
            result = {"exit_code": 1, "message": "La instancia no llegó a ACTIVE con IPv4 (estado: " + str(status) + ")"}
        else:
            log.append("IPv4: " + ipv4)

            # 5. Registrar / actualizar en Tower
            Server = env["cx.tower.server"]
            srv = Server.search([("name", "=", server_name)], limit=1)
            if srv:
                srv.write({"ip_v4_address": ipv4})
                log.append("Servidor Tower actualizado: " + srv.reference)
            else:
                srv = env["cx.tower.server.template"].create_server_from_template(
                    template_ref, server_name, ipv4=ipv4, ssh_key=ssh_key_ref,
                    partner=server.partner_id if server else None,
                )
                log.append("Servidor Tower creado: " + srv.reference)
            srv.write({"url": "https://" + ipv4, "note": "OVH Public Cloud " + region + " / " + flavor_name + " / instance " + instance["id"]})
            env.cr.commit()

            # 6. Esperar a que SSH responda (cloud-init), guardar host key
            ssh_ok = False
            for _ in range(30):
                srv.write({"host_key": False, "skip_host_key": True})
                if srv.test_ssh_connection(raise_on_error=False, return_notification=False).get("status") == 0:
                    ssh_ok = True
                    break
                time.sleep(10)
            srv.write({"skip_host_key": False})
            if not ssh_ok:
                result = {"exit_code": 1, "message": "\n".join(log) + "\nSSH no responde en " + ipv4 + " (revisa firewall/cloud-init)"}
            else:
                srv.write({"host_key": srv._get_host_key_from_host()})
                env.cr.commit()
                # 7. Preparar el host (Docker) con el plan de la plantilla
                plan = env["cx.tower.plan"].get_by_reference("efactusv_ded_server_prepare")
                srv.run_flight_plan(plan)
                log.append("Plan 'Preparar servidor (Docker)' lanzado")
                result = {"exit_code": 0, "message": "\n".join(log)}

- cetmix_tower_model: command
  reference: efactusv_ovh_cloud_delete_server
  name: "efactusv - OVH Cloud: BORRAR instancia"
  action: python_code
  access_level: root
  note: Borra la instancia OVH cuyo nombre = new_server_name y archiva el servidor en Tower. Irreversible.
  code: |
    client = ovh.Client(
        endpoint={{ ovh_endpoint }},
        application_key=#!cxtower.secret.OVH_APPLICATION_KEY!#,
        application_secret=#!cxtower.secret.OVH_APPLICATION_SECRET!#,
        consumer_key=#!cxtower.secret.OVH_CONSUMER_KEY!#,
    )
    project = {{ ovh_cloud_project }}
    region = {{ ovh_cloud_region }}
    server_name = {{ new_server_name }}
    base = "/cloud/project/" + project
    deleted = 0
    for i in client.get(base + "/instance", region=region):
        if i.get("name") == server_name:
            client.delete(base + "/instance/" + i["id"])
            deleted += 1
    srv = env["cx.tower.server"].search([("name", "=", server_name)], limit=1)
    if srv:
        srv.write({"active": False})
    result = {"exit_code": 0, "message": "Instancias borradas: " + str(deleted) + (" | servidor Tower archivado" if srv else "")}

- cetmix_tower_model: plan
  reference: efactusv_ovh_cloud_provision
  name: "efactusv - OVH Cloud: aprovisionar VPS nuevo"
  access_level: root
  allow_parallel_run: false
  on_error_action: e
  note: Pide new_server_name al ejecutar. Ejecutar desde cualquier servidor ya registrado.
  line_ids:
  - sequence: 10
    command_id: efactusv_ovh_cloud_create_server

